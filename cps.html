<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-R3HDWZYVBK"></script>
  <script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-R3HDWZYVBK');
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22> 🧀 </text></svg>" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click The Cheese! - Your CPS Record</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #434445;
      font-family: system-ui;
      user-select: none;
      color: #ffffff;
    }

    p {
      margin: 0;
    }

    #highscoreDisplay {
      font-size: 120px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .btn {
      background-color: #f1f5f9;
      color: #0f172a;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s ease-in-out;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
    }

    .btn:hover {
      background-color: #e2e8f0;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: scale(0.90);
    }
  </style>
</head>
<body>
  
  <p>Your CPS record is</p>
  <div id="highscoreDisplay">0.00</div>
  <p><strong>clicks per second!</strong></p><br>
  <a href="https://clickthecheese.github.io" target="_self" class="btn">Back</a>

  <script>
    const highscoreDisplay = document.getElementById("highscoreDisplay");

    function updateHighscore() {
      const savedHighscore = parseFloat(localStorage.getItem("cpsHighscore")) || 0.00;
      highscoreDisplay.innerText = savedHighscore.toFixed(2);
    }

    updateHighscore();

    window.addEventListener("storage", (event) => {
      if (event.key === "cpsHighscore") {
        updateHighscore();
      }
    });

    setInterval(updateHighscore, 500);
  </script>

</body>
</html>
