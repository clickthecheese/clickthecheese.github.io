<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Click The Cheese! - Play</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #434445;
      font-family: system-ui;
      user-select: none;
      image-rendering: pixelated;
      color: #ffffff;
    }

    button {
      padding: 1px 1px;
      font-size: 217px;
      color: #ffffff;
      background-color: #434445;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      font-family: system-ui;
      font-weight: 400;
      font-style: normal;
      -webkit-tap-highlight-color: transparent;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 1.5);
    }

    button:active {
      transform: scale(0.90);
    }
  </style>
  <link rel="icon" href="data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22&gt; &lt;text y=%22.9em%22 font-size=%2290%22&gt; 🧀 &lt;/text&gt; &lt;/svg&gt;" />
</head>
<body>

  <button id="clickBtn">🧀</button>

  <script>
    const clickBtn = document.getElementById("clickBtn");
    const clickSound = new Audio("https://github.com/clickthecheese/clickthecheese.github.io/raw/refs/heads/main/cheese.mp3");

    clickBtn.addEventListener("click", () => {
      clickSound.currentTime = 0;
      clickSound.play();
    });
  </script>

</body>
</html>
